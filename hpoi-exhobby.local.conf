# Hpoi EXHOBBY v3.2 — local Quantumult X configuration excerpt
# Includes targeted HPOI startup-ad cleanup confirmed from captured traffic.
# Merge these rules into your existing [rewrite_local] section.
# Append the MITM hostnames to your existing hostname list.
# Do not replace your entire Quantumult X configuration with this file.

[rewrite_local]
# HPOI startup advertising
^https://www\.hpoi\.net\.cn/api/common/advert/list(?:\?|$) url reject-dict
^https://api-dsp\.8ziben\.com/api/v2/ios/adverts(?:\?|$) url reject-dict
^https://bid\.buluken\.com/bid(?:\?|$) url reject-dict
^https://oss\.cdn\.adintl\.cn/ url reject

# EXHOBBY native-album integration
^https://www\.exhobby\.net/picture(?:\?|/\d+(?:\?|$)) url script-response-body hpoi-exhobby.js
^https://www\.hpoi\.net\.cn/api/(?:item/get|hobby/album|album/detail|pic/list/relate-v2)(?:\?|$) url script-request-body hpoi-exhobby.js
^https://www\.hpoi\.net\.cn/api/(?:item/get|hobby/album|album/detail|pic/list/relate-v2)(?:\?|$) url script-response-body hpoi-exhobby.js
^https://rfx\.hpoi\.net/[^?]*__exhobby__/cover-v3\.2\.png[^?]*(?:\?.*)?$ url 302 https://raw.githubusercontent.com/colorfullife123/hpoi-exhobby-qx/main/assets/exhobby-cover-v3.2.png
^https://rfx\.hpoi\.net/[^?]*__exhobby__/([^?]+)(?:\?.*)?$ url 302 https://res.e39x.com/pic/n/$1

[mitm]
hostname = www.hpoi.net.cn, rfx.hpoi.net, www.exhobby.net, api-dsp.8ziben.com, bid.buluken.com, oss.cdn.adintl.cn
