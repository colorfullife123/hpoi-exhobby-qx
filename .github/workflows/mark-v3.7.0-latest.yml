{
  "name": "Mark v3.7.0 as latest",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "latest": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Mark release as latest",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh release edit v3.7.0 --repo \"$GITHUB_REPOSITORY\" --latest"
        }
      ]
    }
  }
}
